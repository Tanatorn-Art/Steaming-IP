<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Streaming IP Camera Nodejs</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-wrap: wrap; /* ให้การจัดเรียงกล้องในหลายแถว */
            height: 100vh;
        }
        .camera-container {
            width: 50%; /* แต่ละกล้องจะใช้พื้นที่ครึ่งหนึ่งของหน้าจอ */
            height: 50vh; /* ความสูงของแต่ละกล้อง */
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: black;
        }
        canvas {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
   <!-- กล้อง 1 -->
   <div class="camera-container">
       <canvas id="chanel1"></canvas>
       <script type="text/javascript" src="/js/jsmpeg.min.js"></script>
       <script type="text/javascript">
           var websocket1 = new WebSocket("ws://127.0.0.1:9999");  // WebSocket for first camera
           websocket1.onopen = function() {console.log("WebSocket connected for camera 1"); };
           websocket1.onerror = function(event) { console.error("WebSocket error for camera 1:", event);};
           websocket1.onclose = function() {console.log("WebSocket closed for camera 1");};
           var canvas1 = document.getElementById('chanel1');
           var player1 = new jsmpeg(websocket1, {canvas:canvas1, autoplay:true, loop:true});
       </script>
   </div>
