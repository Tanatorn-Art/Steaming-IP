<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Streaming IP Camera Nodejs</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-evenly; /* จัดการกล้องให้เท่าๆ กัน */
            align-items: center;
            height: 100vh;
            background-color: #f0f0f0; /* สีพื้นหลังอ่อน */
        }
        .camera-container {
            width: 45%; /* ให้แต่ละกล้องใช้พื้นที่ 45% ของหน้าจอ */
            height: 45vh; /* ความสูงของแต่ละกล้อง */
            display: flex;
            justify-content: center;
            align-items: center;
        }
        canvas {
            width: 100%;
            height: 100%;
            border: 2px solid #ddd; /* เพิ่มขอบให้ดู minimal */
        }
    </style>
</head>
<body>
   <!-- กล้อง 1 -->
   <div class="camera-container">
       <canvas id="chanel1"></canvas>
       <script type="text/javascript" src="/js/jsmpeg.min.js"></script>
       <script type="text/javascript">
           var websocket1 = new WebSocket("ws://127.0.0.1:9999");  // WebSocket for first camera
           var canvas1 = document.getElementById('chanel1');
           var player1 = new jsmpeg(websocket1, {canvas:canvas1, autoplay:true, loop:true});
       </script>
   </div>

   <!-- กล้อง 2 -->
   <div class="camera-container">
       <canvas id="chanel2"></canvas>
       <script type="text/javascript">
           var websocket2 = new WebSocket("ws://127.0.0.1:10000");  // WebSocket for second camera
           var canvas2 = document.getElementById('chanel2');
           var player2 = new jsmpeg(websocket2, {canvas:canvas2, autoplay:true, loop:true});
       </script>
   </div>

   <!-- กล้อง 3 -->
   <div class="camera-container">
       <canvas id="chanel3"></canvas>
       <script type="text/javascript" src="/js/jsmpeg.min.js"></script>
       <script type="text/javascript">
           var websocket3 = new WebSocket("ws://127.0.0.1:1100");  // WebSocket for third camera
           var canvas3 = document.getElementById('chanel3');
           var player3 = new jsmpeg(websocket3, {canvas:canvas3, autoplay:true, loop:true});
       </script>
   </div>

   <!-- กล้อง 4 -->
   <div class="camera-container">
       <canvas id="chanel4"></canvas>
       <script type="text/javascript">
           var websocket4 = new WebSocket("ws://127.0.0.1:1200");  // WebSocket for fourth camera
           var canvas4 = document.getElementById('chanel4');
           var player4 = new jsmpeg(websocket4, {canvas:canvas4, autoplay:true, loop:true});
       </script>
   </div>
</body>
</html>
